name: Build Desktop Installers

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --dir Tool/desktop-app exec electron-builder --mac dmg zip
      - uses: actions/upload-artifact@v4
        with:
          name: jacs-studio-macos
          path: Tool/desktop-app/release/*

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --dir Tool/desktop-app exec electron-builder --win nsis
      - uses: actions/upload-artifact@v4
        with:
          name: jacs-studio-windows
          path: Tool/desktop-app/release/*
