services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${JACS_DB_NAME:?JACS_DB_NAME is required}
      POSTGRES_USER: ${JACS_DB_USER:?JACS_DB_USER is required}
      POSTGRES_PASSWORD: ${JACS_DB_PASSWORD:?JACS_DB_PASSWORD is required}
    volumes:
      - jacs_prod_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  api:
    build:
      context: ../BE/api-server
      dockerfile: Dockerfile
    env_file:
      - path: ../../.env
        required: false
    environment:
      JACS_ENV: production
      JACS_STORE_BACKEND: postgres
      JACS_DATABASE_URL: ${JACS_DATABASE_URL:?JACS_DATABASE_URL is required}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live')"]
      interval: 10s
      timeout: 5s
      retries: 12
  web:
    build:
      context: ..
      dockerfile: deploy/admin.Dockerfile
      args:
        VITE_API_URL: ""
        VITE_ADMIN_EMAIL: ${JACS_ADMIN_EMAIL:?JACS_ADMIN_EMAIL is required}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:84:80"
    volumes:
      - ${JACS_DOWNLOADS_DIR:-/opt/jacs-studio/downloads}:/usr/share/nginx/html/downloads:ro
    restart: unless-stopped
volumes:
  jacs_prod_postgres_data:
